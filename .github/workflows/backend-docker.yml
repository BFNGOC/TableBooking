name: Backend Docker

on:
    push:
        branches:
            - docker
        paths:
            - 'backend/**'
            - '.github/workflows/backend-docker.yml'

jobs:
    docker:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        env:
            OWNER_LC: ${{ lowercase(github.repository_owner) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  # Gọi trực tiếp biến env đã được xử lý ở trên
                  tags: ghcr.io/${{ env.OWNER_LC }}/tablebooking-backend:latest
