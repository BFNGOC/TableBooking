name: Backend Docker

on:
    push:
        branches:
            - docker
        paths:
            - 'backend/**'
            - '.github/workflows/backend-docker.yml'

jobs:
    docker:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Docker Image
              run: |
                  # Lấy tên repository hiện tại (ví dụ: BFNGOC/TableBooking) và ép toàn bộ sang chữ thường
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

                  # Chạy lệnh build bằng CLI trực tiếp thay vì qua Action để đảm bảo biến không bị rỗng
                  docker buildx build ./backend \
                    --tag ghcr.io/${REPO_LOWER}-backend:latest \
                    --push
